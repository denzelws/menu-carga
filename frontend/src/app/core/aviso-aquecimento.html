@if (visivel()) {
  <div
    role="status"
    aria-live="polite"
    class="fixed inset-x-4 bottom-20 z-20 rounded-2xl border border-brand-600/20 bg-brand-50 p-4 sm:inset-x-auto sm:right-6 sm:bottom-6 sm:max-w-sm"
  >
    <p class="text-xs font-medium uppercase tracking-wide text-brand-700">Serviço gratuito</p>
    <p class="mt-1 text-sm text-text-900">
      A instância e o banco estão acordando. A primeira resposta pode levar cerca de um minuto.
    </p>
  </div>
}
