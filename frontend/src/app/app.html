<div class="min-h-screen bg-bg-50">
  <header class="border-b border-border-200 bg-surface">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-2">
        <img src="favicon.svg" alt="" width="32" height="32" class="h-8 w-8" />
        <h1 class="text-base font-semibold text-text-900">Menu Carga</h1>
        <span class="rounded-lg bg-bg-50 px-2 py-0.5 text-xs text-text-500">Spring Boot API</span>
      </div>
      <nav class="flex flex-wrap gap-1 text-sm">
        <a
          routerLink="/"
          routerLinkActive="ativo"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-3 py-1.5 text-text-500 hover:bg-bg-50 [&.ativo]:bg-brand-600 [&.ativo]:text-white [&.ativo]:hover:bg-brand-600 [&.ativo]:hover:text-white"
          >Consultar Permissão</a
        >
        <a
          routerLink="/cadastro"
          routerLinkActive="ativo"
          class="rounded-lg px-3 py-1.5 text-text-500 hover:bg-bg-50 [&.ativo]:bg-brand-600 [&.ativo]:text-white [&.ativo]:hover:bg-brand-600 [&.ativo]:hover:text-white"
          >Concessão Manual</a
        >
        <a
          routerLink="/cargas"
          routerLinkActive="ativo"
          class="rounded-lg px-3 py-1.5 text-text-500 hover:bg-bg-50 [&.ativo]:bg-brand-600 [&.ativo]:text-white [&.ativo]:hover:bg-brand-600 [&.ativo]:hover:text-white"
          >Importação CSV</a
        >
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8">
    <router-outlet />
  </main>
  <footer class="border-t border-border-200 px-4 py-4 text-center text-xs text-text-400">
    Menu Carga · Gestão de concessões · sem listagem global
  </footer>
</div>
